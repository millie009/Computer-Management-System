name: Build Computer Management System

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows and Linux installers
        run: npx electron-builder --win nsis --linux AppImage

      - name: Save installers
        uses: actions/upload-artifact@v4
        with:
          name: Computer-Management-System-Installers
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: warn
